<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Log In</title>
    <link rel="stylesheet" href="login.css">
</head>
<header>
    <img src="Images/FloatingPointLogo.png" alt="The Floating Point Logo">
</header>
<body>
    <div>
        <h1>Log in to Floating Point</h1>

        <section>
            <button id="logInGithub"><img id="githubLogo" src="Images/github.D.svg" width="25px">Log in with GitHub</button>
        </section>

        <section>
            <p>Email</p>
            <input type="email">
        </section>

        <section>
            <p>Password</p>
            <input type="password">
        </section>

        <button id="logInButton">Log In</button>
    </div>
</body>
</html>
